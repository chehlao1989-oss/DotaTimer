# Ежедневный сбор сырых матчей и рангов (docs/RECOMMENDER_SPEC.md, раздел 2).
# Результат — файлы релиза «data-raw»: matches-<дата-время>.parquet и ranks-<дата-время>.parquet.
# Каждый запуск добавляет свои файлы, старые не перезаписываются. В историю репозитория данные не попадают.
name: Статистика матчей

on:
  schedule:
    - cron: "0 23 * * *"  # каждый день в 23:00 UTC = 02:00 по Москве
  workflow_dispatch: {}   # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write  # чтобы добавлять файлы в релиз

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Библиотеки сборщика
        run: pip install -r requirements-collector.txt

      - name: Собрать матчи (Steam)
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python tools/collect_raw.py matches --out raw --calls 2500 --max-minutes 210

      - name: Собрать ранги (OpenDota)
        run: python tools/collect_raw.py ranks --matches "$(ls raw/matches-*.parquet)" --out raw --calls 2400 --max-minutes 60

      - name: Добавить файлы в релиз data-raw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data-raw >/dev/null 2>&1 || gh release create data-raw --title "Сырые матчи" \
            --notes "Сырые сыгранные публичные матчи (Steam Web API) и их ранги (OpenDota). Один файл на запуск, по строке на игрока, без аккаунтов. Формат: docs/RECOMMENDER_SPEC.md, раздел 2." \
            --prerelease
          gh release upload data-raw raw/*.parquet
