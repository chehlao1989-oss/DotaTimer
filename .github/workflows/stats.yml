# Постоянный сбор сырых матчей и рангов (docs/RECOMMENDER_SPEC.md, раздел 2; лимиты — docs/DATA_SOURCES.md).
# Запуск 2 раза в сутки (вариант Б автора); каждый запуск продолжает с последнего сохранённого матча (next_seq.txt в релизе).
# Матчи выкладываются в релиз «data-raw» частями каждые 15 минут: matches-<тег>-pNN.parquet,
# потом ranks-<тег>.parquet и run-<тег>.json (цифры запуска для отчёта). В историю репозитория данные не попадают.
name: Статистика матчей

on:
  schedule:
    - cron: "17 11,23 * * *"  # DECISIONS №6; 2 раза в сутки: 02:17 и 14:17 по Москве (не на :00 — BUGLOG №23)
  workflow_dispatch: {}   # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write  # чтобы добавлять файлы в релиз

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Библиотеки сборщика
        run: pip install -r requirements-collector.txt

      - name: Откуда продолжить (последний сохранённый матч)
        run: |
          echo "TAG=$(date -u +%Y-%m-%d-%H%M)" >> "$GITHUB_ENV"
          gh release view data-raw >/dev/null 2>&1 || gh release create data-raw --title "Сырые матчи" \
            --notes "Сырые сыгранные публичные матчи (Steam Web API) и их ранги (OpenDota). Части по 15 минут, по строке на игрока, без аккаунтов. Формат: docs/RECOMMENDER_SPEC.md, раздел 2." \
            --prerelease
          mkdir -p state
          gh release download data-raw -p next_seq.txt -D state || true
          if [ ! -f state/next_seq.txt ]; then
            latest=$(gh release view data-raw --json assets -q '.assets[].name' | grep '^matches-' | sort | tail -1 || true)
            if [ -n "$latest" ]; then gh release download data-raw -p "$latest" -D state; fi
          fi
          ls -la state

      - name: Собрать матчи (Steam)
        id: matches
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python tools/collect_raw.py matches --out raw --state state --release data-raw --tag "$TAG" --max-minutes 290

      - name: Собрать ранги (OpenDota)
        continue-on-error: true  # без рангов матчи всё равно нужны
        # число запросов — по остатку лимита из заголовка ответа OpenDota (лимит по IP раннера)
        run: python tools/collect_raw.py ranks --matches "raw/matches-*.parquet" --out raw --release data-raw --tag "$TAG" --max-minutes 20

      - name: Довыложить файлы, если выгрузка по ходу не прошла
        if: ${{ !cancelled() && hashFiles('raw/*.parquet') != '' }}
        run: |
          gh release upload data-raw raw/*.parquet raw/run-*.json --clobber
          if [ "${{ steps.matches.outcome }}" = "success" ]; then gh release upload data-raw raw/next_seq.txt --clobber; fi

      - name: Отчёт о запуске
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python tools/report.py --run "$GITHUB_RUN_NUMBER"
